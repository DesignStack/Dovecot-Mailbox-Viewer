name: Build Windows and Linux apps

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test Windows
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.txt
            dist/*-src-*.tar.xz
            build/smoke-test.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-util1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0
      - name: Build and test AppImage
        run: bash build-linux.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Linux
          path: |
            dist/*.AppImage
            dist/Third-party-notices-Linux.zip
            dist/Bundled-files-Linux.txt
            dist/SHA256SUMS.txt
            dist/appimage-runtime-src-*.tar.gz
            dist/fuse-src-*.tar.xz
            dist/squashfuse-src-*.tar.gz
            build/smoke-test.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  linux-compatibility:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        distro: ['ubuntu:24.04', 'debian:13']
    container: ${{ matrix.distro }}
    steps:
      - name: Install standard desktop runtime libraries
        run: |
          apt-get update
          apt-get install -y xvfb xauth libgl1 libegl1 libfontconfig1 libdbus-1-3 libglib2.0-0 libxkbcommon0 libxcb1 libxcb-render0 libxcb-shm0 libx11-xcb1 libxrender1 libxext6 libxi6 libsm6 libice6 libxrandr2 libcups2t64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Linux
          path: package
      - name: Test downloaded AppImage without Python
        shell: bash
        run: |
          chmod +x package/dist/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export LOCALAPPDATA="$RUNNER_TEMP/mail-viewer-test"
          timeout 90s xvfb-run -a package/dist/*.AppImage --smoke-test "$RUNNER_TEMP/smoke-test.json"
          cat "$RUNNER_TEMP/smoke-test.json"
  publish:
    needs: [windows, linux, linux-compatibility]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Verify and publish both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/combine_release.py
          python scripts/publish_release.py
