name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

# Serialise release publication; an existing public version is never replaced.
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test
        id: build
        shell: pwsh
        run: ./build-windows.ps1
      - name: Upload executable package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Dovecot-Mailbox-Viewer-Windows-${{ steps.build.outputs.version }}
          path: |
            dist/Dovecot-Mailbox-Viewer-Windows.exe
            dist/SHA256SUMS.txt
            dist/Third-party-notices.zip
            dist/Bundled-files.txt
            dist/*-src-*.tar.xz
          compression-level: 0
          if-no-files-found: error
      - name: Publish new version to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/Scripts/python.exe scripts/publish_release.py
